<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Directory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🎓 Student Directory</h1>
        <p>Add and manage your students</p>
    </header>


    <!-- Main Content -->
    <main>

        <div class="container">

            <h2>👨‍🎓 Student List</h2>

            <p class="description">
                Enter a student name and add it to the list.
            </p>


            <!-- Input Area -->
            <div class="input-area">

                <input
                    type="text"
                    id="studentInput"
                    placeholder="Enter student name"
                >

                <button id="addBtn">
                    ➕ Add Student
                </button>

            </div>


            <!-- Student List -->
            <ul id="studentList"></ul>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>🎓 Student Directory</p>
        <span>Built with HTML, CSS & JavaScript</span>
    </footer>


    <script src="script.js"></script>

</body>
</html>
